schema_version: 1

context:
  version: "0.40.0"

package:
  name: lancedb
  version: ${{ version }}

source:
  url: https://github.com/lancedb/lancedb/archive/v${{ version }}.tar.gz
  sha256: bbb3ebb841e9971bf971a28fd80604b337f90a1e76e6e76e3b5a65d0c6e747f7

build:
  number: 0

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
    - pkg-config
    - libprotobuf
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - maturin >=1.4
  host:
    - python
    - maturin >=1.4
    - pip
    - openssl
  run:
    - python
    - deprecation >=2.1.0
    - lance-namespace >=0.3.2
    - tqdm >=4.27.0
    - pydantic >=1.10
    - packaging >=23.0
    - pyarrow >=16
    - if: match(python, "<3.12")
      then: overrides >=0.7
    - numpy >=1.24.0

tests:
  - python:
      imports:
        - lancedb
      pip_check: true

about:
  summary: Developer-friendly, serverless vector database for AI applications
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/lancedb/lancedb

extra:
  recipe-maintainers:
    - moritzwilksch
    - mediocretech
    - jan-janssen
